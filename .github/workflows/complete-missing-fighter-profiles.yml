name: Complete missing fighter profiles

on:
  workflow_dispatch:
    inputs:
      ufc_profile_max:
        description: "Maximum UFC.com profiles to inspect in this run"
        required: false
        default: "1200"

jobs:
  complete-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fill missing fighter data from UFCStats, Cito and UFC.com
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          UFC_PROFILE_MAX: ${{ inputs.ufc_profile_max }}
        run: python scripts/complete_missing_fighter_profiles.py
