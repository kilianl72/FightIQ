name: V4 Audit Active Fighter Coverage

on:
  workflow_dispatch:

jobs:
  audit-active-fighters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit active Cito fighters
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/audit_cito_active_coverage_v4.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cito-active-coverage-v4-report
          path: cito_active_coverage_v4_report.json
          retention-days: 14
