name: V5.2 Match Cito unmatched fighters

on:
  workflow_dispatch:

jobs:
  match-cito-unmatched:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Match Cito unmatched fighters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/match_cito_unmatched_v5_2.py

      - name: Upload matching report
        uses: actions/upload-artifact@v4
        with:
          name: cito-unmatched-matching-v5-2
          path: cito_unmatched_matching_v5_2_report.json
          retention-days: 14
