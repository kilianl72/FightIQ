          python -m py_compile scripts/sync_fighters.py scripts/enrich_rankings_cito.py
          python -m json.tool data/cito_identity_overrides.json > /dev/null

      - name: Commit the correction to main
        run: |
          git config user.name "FightIQ Automation"
          git config user.email "actions@users.noreply.github.com"

          git add \
            scripts/sync_fighters.py \
            data/cito_identity_overrides.json \
            tests/test_sync_fighters.py

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

