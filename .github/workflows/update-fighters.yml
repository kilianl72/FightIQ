name: Sync FightIQ canonical fighter database

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler et valider sans écrire dans Supabase"
        required: true
        type: boolean
        default: true

  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: fightiq-fighter-database-sync
  cancel-in-progress: false

jobs:
  sync-fighters:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test fighter identity rules
        run: python -m unittest discover -s tests -p 'test_sync_fighters.py' -v

      - name: Sync and validate canonical fighter database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CITO_RESOLUTION_FILES: data/cito_identity_resolution_v5_6.json,data/cito_identity_overrides.json
          FIGHTIQ_QUARANTINE_REPORT: reports/fighter_identity_quarantine.json
        run: python scripts/sync_fighters.py

      - name: Upload administrator identity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fightiq-fighter-identity-report-${{ github.run_number }}
          path: reports/fighter_identity_quarantine.json
          if-no-files-found: warn
          retention-days: 30
