name: Update FightIQ fighter data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

jobs:
  import-fighters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import fighters from UFCStats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/import_fighters.py

      - name: Enrich UFC rankings with Cito
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/enrich_rankings_cito.py
