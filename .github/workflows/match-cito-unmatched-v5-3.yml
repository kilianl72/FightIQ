name: V5.3 Alias-aware Cito matching

on:
  workflow_dispatch:

jobs:
  match-cito-aliases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alias-aware matching
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/match_cito_unmatched_v5_3_alias_aware.py

      - name: Upload V5.3 report
        uses: actions/upload-artifact@v4
        with:
          name: cito-unmatched-matching-v5-3
          path: cito_unmatched_matching_v5_3_report.json
          retention-days: 14
