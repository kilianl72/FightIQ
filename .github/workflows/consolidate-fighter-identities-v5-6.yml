name: V5.6 Consolidate fighter identities

on:
  workflow_dispatch:

jobs:
  consolidate-fighter-identities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Consolidate identities and create verified missing fighters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/consolidate_fighter_identities_v5_6.py
