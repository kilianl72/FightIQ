name: V5.4 Bulk resolve Cito fighters

on:
  workflow_dispatch:

jobs:
  bulk-resolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bulk resolve unmatched Cito fighters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/resolve_cito_unmatched_v5_4_bulk.py

      - name: Upload V5.4 report
        uses: actions/upload-artifact@v4
        with:
          name: cito-bulk-resolution-v5-4
          path: cito_bulk_resolution_v5_4_report.json
          retention-days: 14
