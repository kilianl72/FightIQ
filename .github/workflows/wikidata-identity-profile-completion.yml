name: Wikidata identity and profile completion

on:
  workflow_dispatch:

jobs:
  wikidata-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Wikidata identities and fill missing stable fields
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/complete_fighter_profiles_wikidata_v2.py
