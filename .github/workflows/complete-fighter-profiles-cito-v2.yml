name: Complete fighter profiles from Cito raw

on:
  workflow_dispatch:

jobs:
  complete-cito-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout FightIQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fill missing fighter fields from all mapped Cito profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/complete_fighter_profiles_cito_v2.py

      - name: Refresh rankings and current champion status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/enrich_rankings_cito.py
